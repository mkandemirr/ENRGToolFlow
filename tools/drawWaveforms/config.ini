[input]
rootFile = ../output/run_103_events.root      ; events file from convertWaveforms, relative to ~/Desktop/enrg/build
treeName = events                             ; events TTree name

[output]
pdfFile = ../output/run_103_drawWaveforms.pdf ; output PDF, one page per event
overwriteOutput = false                       ; false = stop if the output file already exists

[analysis]
firstEntry = 2                                ; first tree entry to draw
maxEvents = 4                                 ; number of events to draw, -1 = all (one page each)
channels = 0,1,2,3,4,5,6,7                    ; channels to draw, one row each, in this order
baselineWindowNs = 5000                       ; leading samples used for the displayed baseline and rms [ns]
pulseSearchStartNs = 10000                    ; start of the window searched for the zoom centre [ns]
pulseSearchEndNs = 12500                      ; end of the window searched for the zoom centre [ns]
pulseThresholdMv = 8                          ; minimum depth below baseline that counts as a pulse [mV]
zoomHalfWidthNs = 100                         ; half width of the right-hand zoom panel [ns]
nEnvelopeBins = 2000                          ; min/max bins of the left-hand full-window panel
minPlateauSamples = 3                         ; consecutive samples at the minimum for "possible saturation"
minSaturationDepthMv = 900                    ; minimum depth below baseline for "possible saturation" [mV]; run 103 clips at about -969 to -981 mV (docs/Taban_Cizgisi_ve_Pedestal.docx)
minYHalfRangeMv = 8                           ; y axis spans at least baseline +- this value [mV]
yPaddingMv = 3                                ; extra y range beyond the waveform minimum and maximum [mV]
