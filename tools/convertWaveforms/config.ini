[input]
rootFile = ../runs/run_103_waveforms.root   ; raw ENRGDAQ file, relative to ~/Desktop/enrg/build
treeName = digitizer_waveforms              ; raw TTree name
readCacheSizeMb = 100                       ; TTreeCache size for reading the raw tree [MB]

[output]
rootFile = ../output/run_103_events.root    ; output file, must differ from the input file
treeName = events                           ; output TTree name
compressionSetting = 505                    ; ROOT setting: 100 * algorithm + level (505 = ZSTD, level 5)
overwriteOutput = false                     ; false = stop if the output file already exists

[analysis]
maxEvents = -1                              ; number of events to convert, -1 = all

[qualityFlags]
; qualityFlags = sum of the values of the checks that found a problem; 0 = no problem.
; true = check is done, false = check is skipped and its bit is always 0.
; Flagged events are always written; the flags are informational only.
checkMissingChannel     = true              ; bit 0, value 1:  a channel from expectedChannels is missing
expectedChannels        = 0,1,2,3,4,5,6,7   ; channels expected in every event (used by bit 0)
checkDuplicateChannel   = true              ; bit 1, value 2:  a channel appears in more than one block
checkUnequalLength      = true              ; bit 2, value 4:  channel blocks of one event have different lengths
checkDaqLimit           = true              ; bit 3, value 8:  a block length equals daqMaxSamplesPerChannel
daqMaxSamplesPerChannel = 65536             ; [samples] ENRGDAQ limit (used by bit 3): 2048 before 06.06.2026, 65536 from 06.06 to 15.09.2026, 131072 afterwards
checkCounterGap         = true              ; bit 4, value 16: eventCounter increased by more than 1
checkCounterBackward    = true              ; bit 5, value 32: eventCounter decreased
checkTimeBackward       = true              ; bit 6, value 64: triggerTimeNs decreased
