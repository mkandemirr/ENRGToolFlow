[input]
rootFile = ../runs/run_103_waveforms.root   ; raw ENRGDAQ file, relative to ~/Desktop/enrg/build
treeName = digitizer_waveforms              ; raw TTree name
readCacheSizeMb = 100                       ; TTreeCache size for reading the raw tree [MB]

[output]
rootFile = ../output/run_103_events.root    ; output file, must differ from the input file
treeName = events                           ; output TTree name
compressionSetting = 505                    ; ROOT setting: 100 * algorithm + level (505 = ZSTD, level 5)
overwriteOutput = false                     ; false = stop if the output file already exists

[analysis]
expectedChannels = 0,1,2,3,4,5,6,7          ; channels expected in every event (only for qualityFlags bit 0)
daqMaxSamplesPerChannel = 65536             ; ENRGDAQ per-channel limit for this run (only for qualityFlags bit 3)
maxEvents = -1                              ; number of events to convert, -1 = all
