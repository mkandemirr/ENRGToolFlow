[input]
rootFile = ../output/run_103_events.root          ; events file from convertWaveforms, relative to ~/Desktop/enrg/build
treeName = events                                 ; events TTree name

[output]
pdfFile = ../output/run_103_triggerPosition.pdf   ; summary page + one page per channel: average waveform and occupancy histogram
overwriteOutput = false                           ; false = stop if the output file already exists

[analysis]
maxEvents = -1                                    ; number of events to use, -1 = all
channels = 0,1,2,3,4,5,6,7                        ; channels to analyse
postTriggerPercent = -1                           ; [%] digitizer post-trigger setting of the run; -1 = unknown, comparison skipped
cfFraction = 0.5                                  ; leading edge = first crossing of cfFraction x minimum of the average waveform
daqBaselineFraction = 0.10                        ; fraction of the record ENRGDAQ uses for its baseline (P_DAQ); warn if the trigger position is inside it
plotHalfWindowNs = 200                            ; [ns] half width of the zoomed plots around the measured position (display only)
